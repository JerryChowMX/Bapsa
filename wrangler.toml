# Cloudflare Pages.
#
# `pages_build_output_dir` deja que `wrangler pages deploy` funcione sin
# argumentos desde la raíz del repositorio.
#
# El build de Pages debe usar `npm run build:only`, NO `npm run build`:
# el segundo corre además la batería de pruebas, que necesita Python y
# tarda de más en un runner de CI. Las pruebas van en local y en el hook
# de integración continua, no bloqueando un deploy de preview.
name = "bapsa"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-15"
