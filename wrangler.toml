# Cloudflare Pages.
#
# `pages_build_output_dir` deja que `wrangler pages deploy` funcione sin
# argumentos desde la raíz del repositorio.
#
# El build command es `npm run build`, que solo construye. Las pruebas
# viven en `npm run verify` y corren en local y en CI, nunca bloqueando
# un despliegue.
name = "bapsa"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-15"
